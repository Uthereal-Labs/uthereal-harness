services:
  harness:
    image: uthereal-harness:local
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    env_file:
      - path: .env
        required: false
    environment:
      GOOSE_PATH_ROOT: /var/lib/goose
      GOOSE_DISABLE_KEYRING: "1"
      GOOSE_SERVER__SECRET_KEY: ${GOOSE_SERVER__SECRET_KEY:?set GOOSE_SERVER__SECRET_KEY}
      GOOSE_PROVIDER: ${GOOSE_PROVIDER:?set GOOSE_PROVIDER}
      GOOSE_MODEL: ${GOOSE_MODEL:?set GOOSE_MODEL}
      OTEL_TRACES_EXPORTER: ${OTEL_TRACES_EXPORTER:-none}
      OTEL_METRICS_EXPORTER: ${OTEL_METRICS_EXPORTER:-none}
      OTEL_LOGS_EXPORTER: ${OTEL_LOGS_EXPORTER:-none}
      OTEL_EXPORTER_OTLP_TRACES_PROTOCOL: ${OTEL_EXPORTER_OTLP_TRACES_PROTOCOL:-http/protobuf}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-uthereal-goose-harness}
    command: ["serve", "--host", "0.0.0.0", "--port", "3284", "--platform", "cli", "--with-builtin", "developer,summon"]
    ports:
      - "127.0.0.1:${GOOSE_PORT:-3284}:3284"
    volumes:
      - harness-state:/var/lib/goose
      - harness-workspace:/workspace
    restart: unless-stopped
    stop_grace_period: 30s

volumes:
  harness-state:
  harness-workspace:
